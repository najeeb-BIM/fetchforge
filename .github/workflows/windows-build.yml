name: Windows build
# Reproducible Windows build: runs on a Windows runner because a Windows
# x64 binary, WebView2/Tauri bundle and NSIS installer cannot be produced
# or verified on Linux. Validated locally with actionlint 1.7.7.
# Manual run (for a non-developer): see docs/WINDOWS_BUILD_GUIDE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Run only the diagnostic engine build (skip the full build)"
        type: boolean
        default: false
jobs:
  windows:
    if: ${{ !inputs.diagnostic_only }}
    # DIAGNOSTIC (2026-11-25): eight round-11 runs failed identically on
    # windows-latest (windows-2025 image) — runner dies in the Engine
    # phase, zero logs — while the same code builds in 2m45s locally
    # and round 10 passed on windows-2025 at 03:08Z. Testing whether the
    # windows-2025 runner pool/image is the cause. Revisit once the
    # build passes or the image is ruled out.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install NSIS
        run: |
          choco install nsis -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Run tests
        run: cargo test
      - name: Free disk space for the release build
        shell: pwsh
        run: |
          # The test run leaves ~3 GB of dev artifacts in target/debug that
          # the release build never uses. Round-11 runs died ~58 min in
          # with the build step stuck and no logs — consistent with the
          # runner running out of disk mid-build. Reclaim the dev artifacts
          # and report free space so the log shows the headroom.
          if (Test-Path target/debug) { Remove-Item -Recurse -Force target/debug }
          "Free space on C: $([math]::Round((Get-PSDrive C).Free / 1GB, 2)) GB"
      # The build runs as three steps (Engine / Tauri / Package) instead of
      # one: five round-11 runs died with the single build step stuck and
      # zero logs, so per-step status is the only signal that survives a
      # runner death — the split shows exactly which phase dies.
      - name: Build engine and bridge (release)
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Phase Engine
      - name: Build Tauri app
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Phase Tauri
      - name: Stage, download yt-dlp, build installer and portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Phase Package
      - name: Print SHA-256 of each output file
        shell: pwsh
        run: |
          $files = @(
            "installer/FetchForge-Setup-0.2.0-x64.exe",
            "dist/FetchForge-portable-x64.zip",
            "installer/stage/FetchForge.exe",
            "installer/stage/fetchforge-bridge.exe",
            "installer/stage/yt-dlp.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing expected output file: $f" }
            (Get-FileHash -Algorithm SHA256 $f).Hash + "  " + $f
          }
      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: fetchforge-windows-x64
          path: |
            installer/FetchForge-Setup-0.2.0-x64.exe
            dist/FetchForge-portable-x64.zip
  # TEMPORARY DIAGNOSTIC (2026-11-25): nine main-workflow runs died with
  # the Engine step stuck and zero logs, but the isolated release build
  # (run 45509381392) PASSED in under 6 min — so an earlier main-workflow
  # step is the cause. This job bisects: it currently runs checkout +
  # toolchain + cargo test + the release build (10-min timeout). If it
  # fails, the tests step is implicated; if it passes, the next suspect
  # is the tauri-cli install. Remove after the cause is found.
  diag:
    if: ${{ inputs.diagnostic_only }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests (bisection)
        run: cargo test
      - name: Release build with 10-minute timeout
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "cargo" -ArgumentList "build","--release","-p","fetchforge-engine","-p","fetchforge-bridge","-j","2" -NoNewWindow -PassThru -RedirectStandardOutput "build-out.log" -RedirectStandardError "build-err.log"
          if (-not $proc.WaitForExit(600000)) {
            $proc.Kill()
            Write-Host "=== stdout tail ==="
            Get-Content build-out.log -Tail 50 -ErrorAction SilentlyContinue
            Write-Host "=== stderr tail ==="
            Get-Content build-err.log -Tail 50 -ErrorAction SilentlyContinue
            throw "TIMEOUT: release build did not finish within 10 minutes (local Linux: 2m45s)"
          }
          Write-Host "=== stdout tail ==="
          Get-Content build-out.log -Tail 20 -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            Write-Host "=== stderr tail ==="
            Get-Content build-err.log -Tail 50 -ErrorAction SilentlyContinue
            throw "cargo build failed with exit code $($proc.ExitCode)"
          }
          Write-Host "Release build finished OK"
