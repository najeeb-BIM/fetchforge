name: Windows build
# Reproducible Windows build: runs on a Windows runner because a Windows
# x64 binary, WebView2/Tauri bundle and NSIS installer cannot be produced
# or verified on Linux. Validated locally with actionlint 1.7.7.
# Manual run (for a non-developer): see docs/WINDOWS_BUILD_GUIDE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install NSIS
        run: |
          choco install nsis -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Run tests
        run: cargo test
      - name: Free disk space for the release build
        shell: pwsh
        run: |
          # The test run leaves ~3 GB of dev artifacts in target/debug that
          # the release build never uses. Round-11 runs died ~58 min in
          # with the build step stuck and no logs — consistent with the
          # runner running out of disk mid-build. Reclaim the dev artifacts
          # and report free space so the log shows the headroom.
          if (Test-Path target/debug) { Remove-Item -Recurse -Force target/debug }
          "Free space on C: $([math]::Round((Get-PSDrive C).Free / 1GB, 2)) GB"
      # The build runs as three steps (Engine / Tauri / Package) instead of
      # one: five round-11 runs died with the single build step stuck and
      # zero logs, so per-step status is the only signal that survives a
      # runner death — the split shows exactly which phase dies.
      - name: Build engine and bridge (release)
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Phase Engine
      - name: Build Tauri app
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Phase Tauri
      - name: Stage, download yt-dlp, build installer and portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Phase Package
      - name: Print SHA-256 of each output file
        shell: pwsh
        run: |
          $files = @(
            "installer/FetchForge-Setup-0.2.0-x64.exe",
            "dist/FetchForge-portable-x64.zip",
            "installer/stage/FetchForge.exe",
            "installer/stage/fetchforge-bridge.exe",
            "installer/stage/yt-dlp.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing expected output file: $f" }
            (Get-FileHash -Algorithm SHA256 $f).Hash + "  " + $f
          }
      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: fetchforge-windows-x64
          path: |
            installer/FetchForge-Setup-0.2.0-x64.exe
            dist/FetchForge-portable-x64.zip
