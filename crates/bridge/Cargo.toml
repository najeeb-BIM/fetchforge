[package]
name = "fetchforge-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FetchForge localhost bridge: extension API on loopback only, plus Chrome/Firefox native-messaging host"

[dependencies]
fetchforge-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "fetchforge-bridge"
path = "src/main.rs"
