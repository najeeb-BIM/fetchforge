[package]
name = "fetchforge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Download engine for FetchForge: HTTP/HTTPS, Range resume, segmented downloads, safe filenames"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
url = "2"

[dev-dependencies]
