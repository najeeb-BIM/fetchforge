[package]
name = "fetchforge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Download engine for FetchForge: HTTP/HTTPS, Range resume, segmented downloads, safe filenames"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
url = "2"
# Extracting bin/ffmpeg.exe from the pinned gyan.dev essentials zip
# (first-use ffmpeg provisioning). Deflate only: the gyan zip uses
# deflate, and the other codecs would only bloat the binary.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Parsing DASH manifests (MPD is XML; attribute order, self-closing
# tags and namespaces vary, so a real parser beats string scanning).
# No default features: MPDs are UTF-8, encoding_rs is not needed.
quick-xml = { version = "0.38", default-features = false }

[dev-dependencies]
