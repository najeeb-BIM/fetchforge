<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:system-ui;width:320px;padding:12px}input,button{width:100%;margin:4px 0;padding:8px;box-sizing:border-box}button{background:#22c55e;border:0;border-radius:6px;font-weight:600;cursor:pointer}</style></head>
<body><h3>FetchForge</h3><p id="status">Checking…</p>
<input id="url" placeholder="Paste a download link">
<input id="filename" placeholder="Filename (optional)">
<button id="send">Send to FetchForge</button>
<hr><label>Pairing code (from FetchForge Settings &gt; Pair a browser, 60 seconds)</label>
<input id="pairCode" placeholder="e.g. ABCD-EFGH">
<button id="pair">Pair with code</button>
<button id="advancedToggle">Advanced</button>
<div id="advanced" style="display:none"><label>Bridge token (advanced, manual entry only)</label>
<input id="token" type="password" placeholder="Paste token once">
<button id="saveToken">Save token</button>
<p style="color:#dc2626;font-weight:700">Never paste this into a website</p></div>
<p id="fallbackNote"></p>
<p><small>If the app is not running, the link falls back to your browser's downloader. No browsing history is sent anywhere.</small></p>
<script src="popup.js"></script></body></html>
